name: Bulk Categorization Apply PostgreSQL Validation

on:
  push:
    branches:
      - codex/v012-bulk-apply-validation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: finspace
          POSTGRES_PASSWORD: finspace
          POSTGRES_DB: finspace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finspace -d finspace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        shell: bash

    env:
      DATABASE_URL: postgresql+asyncpg://finspace:finspace@127.0.0.1:5432/finspace
      TEST_DATABASE_URL: postgresql+asyncpg://finspace:finspace@127.0.0.1:5432/test_finspace_base
      REDIS_URL: redis://127.0.0.1:6379/0
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
      ENVIRONMENT: development
      TESTING: "true"
      JWT_SECRET_KEY: github-actions-validation-key-not-for-production-0123456789
      CORS_ORIGINS: http://localhost:3000

    steps:
      - name: Check out validation branch
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e "backend[dev]"

      - name: Mirror production Apps Script package mount
        run: |
          sudo install -d -m 0755 /app
          sudo ln -s "$GITHUB_WORKSPACE/google-apps-script" /app/google-apps-script

      - name: Runtime evidence
        run: |
          python --version
          python -m pip --version
          PGPASSWORD=finspace psql -h 127.0.0.1 -U finspace -d finspace -c "SELECT version();"
          python -c "import redis; assert redis.Redis.from_url('redis://127.0.0.1:6379/0').ping(); print('redis_ping=PASS')"

      - name: Fresh migration proof
        env:
          DATABASE_URL: postgresql+asyncpg://finspace:finspace@127.0.0.1:5432/apply_test
        run: |
          PGPASSWORD=finspace createdb -h 127.0.0.1 -U finspace apply_test
          (cd backend && alembic -c alembic.ini upgrade head)
          test "$(PGPASSWORD=finspace psql -h 127.0.0.1 -U finspace -d apply_test -Atc 'select version_num from alembic_version')" = "0015_categorization_apply_operations"
          PGPASSWORD=finspace psql -h 127.0.0.1 -U finspace -d apply_test -v ON_ERROR_STOP=1 <<'SQL'
          SELECT to_regclass('public.categorization_apply_operations') IS NOT NULL AS operations_exist;
          SELECT to_regclass('public.categorization_apply_results') IS NOT NULL AS results_exist;
          SELECT conname, contype FROM pg_constraint
          WHERE conrelid IN ('categorization_apply_operations'::regclass,
                             'categorization_apply_results'::regclass)
          ORDER BY conname;
          SELECT indexname FROM pg_indexes
          WHERE tablename IN ('categorization_apply_operations', 'categorization_apply_results')
          ORDER BY indexname;
          SQL

      - name: Downgrade and re-upgrade proof
        env:
          DATABASE_URL: postgresql+asyncpg://finspace:finspace@127.0.0.1:5432/apply_test
        run: |
          (cd backend && alembic -c alembic.ini downgrade 0014_categorization_previews)
          test "$(PGPASSWORD=finspace psql -h 127.0.0.1 -U finspace -d apply_test -Atc 'select version_num from alembic_version')" = "0014_categorization_previews"
          REMOVED=$(PGPASSWORD=finspace psql -h 127.0.0.1 -U finspace -d apply_test -Atc "SELECT CASE WHEN to_regclass('public.categorization_apply_operations') IS NULL AND to_regclass('public.categorization_apply_results') IS NULL THEN 1 ELSE 0 END;")
          test "$REMOVED" = "1"
          KEPT=$(PGPASSWORD=finspace psql -h 127.0.0.1 -U finspace -d apply_test -Atc "SELECT CASE WHEN to_regclass('public.categorization_previews') IS NOT NULL AND to_regclass('public.categorization_preview_items') IS NOT NULL THEN 1 ELSE 0 END;")
          test "$KEPT" = "1"
          (cd backend && alembic -c alembic.ini upgrade head)
          test "$(PGPASSWORD=finspace psql -h 127.0.0.1 -U finspace -d apply_test -Atc 'select version_num from alembic_version')" = "0015_categorization_apply_operations"

      - name: Upgrade from the exact main 0014 schema with existing preview data
        env:
          DATABASE_URL: postgresql+asyncpg://finspace:finspace@127.0.0.1:5432/main_schema_test
        run: |
          PGPASSWORD=finspace createdb -h 127.0.0.1 -U finspace main_schema_test
          (cd backend && alembic -c alembic.ini upgrade 0014_categorization_previews)
          PGPASSWORD=finspace psql -h 127.0.0.1 -U finspace -d main_schema_test -v ON_ERROR_STOP=1 <<'SQL'
          WITH seed_user AS (
            INSERT INTO users (id, email, normalized_email, display_name, locale, timezone)
            VALUES (gen_random_uuid(), 'seed@example.com', 'seed@example.com',
                    'Seed owner', 'ru-RU', 'Asia/Yekaterinburg')
            RETURNING id
          ), seed_workspace AS (
            INSERT INTO workspaces (id, name, base_currency, timezone, owner_user_id)
            SELECT gen_random_uuid(), 'Existing workspace', 'RUB', 'Asia/Yekaterinburg', id
            FROM seed_user
            RETURNING id, owner_user_id
          )
          INSERT INTO categorization_previews
            (id, workspace_id, created_by, rule_set_version, selection_mode, selection, expires_at)
          SELECT gen_random_uuid(), id, owner_user_id, 1, 'filter', '{"mode":"filter"}'::jsonb,
                 now() + interval '24 hours'
          FROM seed_workspace;
          SQL
          BEFORE=$(PGPASSWORD=finspace psql -h 127.0.0.1 -U finspace -d main_schema_test -Atc 'SELECT count(*) FROM categorization_previews;')
          (cd backend && alembic -c alembic.ini upgrade 0015_categorization_apply_operations)
          AFTER=$(PGPASSWORD=finspace psql -h 127.0.0.1 -U finspace -d main_schema_test -Atc 'SELECT count(*) FROM categorization_previews;')
          OPERATIONS=$(PGPASSWORD=finspace psql -h 127.0.0.1 -U finspace -d main_schema_test -Atc 'SELECT count(*) FROM categorization_apply_operations;')
          echo "previews_before=$BEFORE previews_after=$AFTER operations=$OPERATIONS"
          test "$BEFORE" = "1"
          test "$BEFORE" = "$AFTER"
          test "$OPERATIONS" = "0"

      - name: Focused bulk apply suite
        working-directory: backend
        run: python scripts/test_runner.py -- tests/test_categorization_bulk_apply.py -vv

      - name: Preview and categorization rule suites
        working-directory: backend
        run: |
          python scripts/test_runner.py -- tests/test_categorization_previews.py -q
          python scripts/test_runner.py -- tests/test_categorization_rules.py -q

      - name: Full backend PostgreSQL suite
        working-directory: backend
        run: python scripts/test_runner.py -- -q

      - name: Backend static gates
        run: |
          python -m ruff check backend
          python -m ruff format --check backend
          python -m mypy backend/app
          python -m compileall -q backend/app
          PYTHONPATH=backend python -c "from app.main import app; print('backend_import_smoke=PASS', app.title)"

      - name: Patch hygiene
        run: git diff --check
