name: Payees PostgreSQL Validation

on:
  push:
    branches:
      - codex/payees-postgres-validation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: finspace
          POSTGRES_PASSWORD: finspace
          POSTGRES_DB: finspace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finspace -d finspace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        shell: bash

    env:
      DATABASE_URL: postgresql+asyncpg://finspace:finspace@127.0.0.1:5432/finspace
      TEST_DATABASE_URL: postgresql+asyncpg://finspace:finspace@127.0.0.1:5432/finspace_test_base
      REDIS_URL: redis://127.0.0.1:6379/0
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
      ENVIRONMENT: development
      TESTING: "true"
      JWT_SECRET_KEY: github-actions-validation-key-not-for-production-0123456789
      CORS_ORIGINS: http://localhost:3000

    steps:
      - name: Check out validation branch
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and validation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e "backend[dev]"

      - name: Runtime evidence
        run: |
          python --version
          python -m pip --version
          PGPASSWORD=finspace psql -h 127.0.0.1 -U finspace -d finspace -c "SELECT version();"
          PGPASSWORD=finspace psql -h 127.0.0.1 -U finspace -d finspace -c "SHOW server_version;"
          redis-cli -h 127.0.0.1 ping

      - name: Fresh and historical migration proof
        run: python .github/validation/payees_postgres_proof.py

      - name: Focused Payees PostgreSQL suite
        working-directory: backend
        run: python scripts/test_runner.py -- tests/test_payees.py -vv

      - name: Full backend PostgreSQL suite
        working-directory: backend
        run: python scripts/test_runner.py -- -q

      - name: Backend static gates
        run: |
          python -m ruff check backend
          python -m ruff format --check backend
          python -m mypy backend/app
          python -m compileall -q backend/app
          python -c "from app.main import app; print('backend_import_smoke=PASS', app.title)"
        env:
          PYTHONPATH: backend

      - name: Patch hygiene
        run: git diff --check
