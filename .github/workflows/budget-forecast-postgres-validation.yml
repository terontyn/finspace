name: Temporary Budget Forecast PostgreSQL validation

on:
  push:
    branches:
      - codex/budget-forecast-postgres-validation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-budget-forecast-postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: finspace_test
          POSTGRES_USER: finspace_test
          POSTGRES_PASSWORD: temporary-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finspace_test -d finspace_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: finspace_test
      POSTGRES_PASSWORD: temporary-test-password
      POSTGRES_BASE_DB: finspace_test
      DATABASE_URL: postgresql+asyncpg://finspace_test:temporary-test-password@127.0.0.1:5432/finspace_test
      TEST_DATABASE_URL: postgresql+asyncpg://finspace_test:temporary-test-password@127.0.0.1:5432/finspace_test
      REDIS_URL: redis://127.0.0.1:6379/15
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
      ENVIRONMENT: test
      TESTING: "true"
      JWT_SECRET_KEY: temporary-ci-jwt-secret-with-at-least-32-characters
      CORS_ORIGINS: http://localhost:3000
      ALLOW_REGISTRATION: "true"
      ALLOW_DEV_AUTH_HEADERS: "false"
      PYTHONUNBUFFERED: "1"

    defaults:
      run:
        working-directory: backend
        shell: bash

    steps:
      - name: Checkout temporary validation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expose Apps Script package at the runtime path
        run: |
          sudo install -d -m 0755 /app
          sudo ln -s "$GITHUB_WORKSPACE/google-apps-script" /app/google-apps-script
          test -f /app/google-apps-script/Template.gs

      - name: Set up repository-supported Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend with existing development contract
        run: python -m pip install --editable ".[dev]"

      - name: Prove ephemeral PostgreSQL 17 environment
        run: |
          python --version
          python - <<'PY'
          import asyncio
          import os

          import asyncpg


          async def main() -> None:
              connection = await asyncpg.connect(
                  host=os.environ["POSTGRES_HOST"],
                  port=int(os.environ["POSTGRES_PORT"]),
                  user=os.environ["POSTGRES_USER"],
                  password=os.environ["POSTGRES_PASSWORD"],
                  database=os.environ["POSTGRES_BASE_DB"],
              )
              try:
                  row = await connection.fetchrow(
                      "SELECT current_database() AS database_name, "
                      "current_user AS database_user, version() AS server_version"
                  )
                  print(f"database={row['database_name']}")
                  print(f"user={row['database_user']}")
                  print(f"postgres={row['server_version']}")
                  assert row["database_name"] == "finspace_test"
                  assert row["database_user"] == "finspace_test"
                  assert "PostgreSQL 17" in row["server_version"]
              finally:
                  await connection.close()


          asyncio.run(main())
          PY

      - name: Prove fresh database baseline is exactly 0010_goals
        run: |
          run_id="$(python -c 'import uuid; print(uuid.uuid4().hex)')"
          database_name="finspace_test_${run_id}"
          export DATABASE_URL="postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${database_name}"
          export MIGRATION_DATABASE_NAME="$database_name"

          cleanup() {
            python - <<'PY'
          import asyncio
          import os

          import asyncpg


          async def main() -> None:
              database_name = os.environ["MIGRATION_DATABASE_NAME"]
              assert database_name.startswith("finspace_test_")
              connection = await asyncpg.connect(
                  host=os.environ["POSTGRES_HOST"],
                  port=int(os.environ["POSTGRES_PORT"]),
                  user=os.environ["POSTGRES_USER"],
                  password=os.environ["POSTGRES_PASSWORD"],
                  database="postgres",
              )
              try:
                  await connection.execute(
                      "SELECT pg_terminate_backend(pid) FROM pg_stat_activity "
                      "WHERE datname = $1 AND pid <> pg_backend_pid()",
                      database_name,
                  )
                  await connection.execute(f'DROP DATABASE IF EXISTS "{database_name}"')
                  print(f"removed={database_name}")
              finally:
                  await connection.close()


          asyncio.run(main())
          PY
          }
          trap cleanup EXIT

          python - <<'PY'
          import asyncio
          import os

          import asyncpg


          async def main() -> None:
              database_name = os.environ["MIGRATION_DATABASE_NAME"]
              assert database_name.startswith("finspace_test_")
              connection = await asyncpg.connect(
                  host=os.environ["POSTGRES_HOST"],
                  port=int(os.environ["POSTGRES_PORT"]),
                  user=os.environ["POSTGRES_USER"],
                  password=os.environ["POSTGRES_PASSWORD"],
                  database="postgres",
              )
              try:
                  await connection.execute(f'CREATE DATABASE "{database_name}"')
                  print(f"created={database_name}")
              finally:
                  await connection.close()


          asyncio.run(main())
          PY

          alembic upgrade head
          alembic current | tee /tmp/finspace-alembic-current.txt
          alembic heads | tee /tmp/finspace-alembic-heads.txt
          grep -Eq '^0010_goals( \(head\))?$' /tmp/finspace-alembic-current.txt
          grep -Eq '^0010_goals( \(head\))?$' /tmp/finspace-alembic-heads.txt
          test "$(grep -Ec '^0010_goals( \(head\))?$' /tmp/finspace-alembic-heads.txt)" -eq 1
          ! grep -q '0011' /tmp/finspace-alembic-heads.txt

      - name: Run focused Budget Forecast PostgreSQL tests
        run: |
          python scripts/test_runner.py -- \
            tests/test_budget_forecasts.py \
            -vv --tb=short --durations=0 --capture=tee-sys

      - name: Run Recurring regression tests
        run: |
          python scripts/test_runner.py -- \
            tests/test_automations.py -q -k recurring --durations=10

      - name: Run Budget regression tests
        run: |
          python scripts/test_runner.py -- tests/test_budgets.py -q --durations=10

      - name: Run Month Close regression tests
        run: |
          python scripts/test_runner.py -- \
            tests/test_automations.py -q -k month_close --durations=10
          python scripts/test_runner.py -- \
            tests/test_month_close_invariants.py \
            tests/test_month_close_product.py \
            -q --durations=10

      - name: Run Goals regression tests
        run: |
          python scripts/test_runner.py -- tests/test_goals.py -q --durations=10

      - name: Run full backend PostgreSQL suite
        run: python scripts/test_runner.py -- -q --durations=20

      - name: Ruff
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Compileall
        run: python -m compileall -q app tests

      - name: Focused Budget Forecast mypy gate
        run: |
          python -m mypy \
            app/api/routes/budgets.py \
            app/db/session.py \
            app/dependencies/database.py \
            app/services/recurrence.py \
            app/repositories/budget_forecasts.py \
            app/schemas/budget_forecasts.py \
            app/services/budget_forecasts.py \
            tests/test_budget_forecasts.py

      - name: Full app mypy gate
        run: python -m mypy app

      - name: Validate exact temporary branch scope
        working-directory: .
        run: |
          baseline=7e85d779df744a098b31224ad5339c4b6db5fac0
          git diff "$baseline" HEAD --check
          git diff --name-only "$baseline" HEAD | sort > /tmp/actual-files.txt
          cat > /tmp/expected-files.txt <<'EOF'
          .github/workflows/budget-forecast-postgres-validation.yml
          backend/app/api/routes/budgets.py
          backend/app/db/session.py
          backend/app/dependencies/database.py
          backend/app/repositories/budget_forecasts.py
          backend/app/schemas/budget_forecasts.py
          backend/app/services/budget_forecasts.py
          backend/app/services/recurrence.py
          backend/tests/test_budget_forecasts.py
          EOF
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
          echo "backend_tree=$(git rev-parse HEAD:backend)"
          git merge-base --is-ancestor 9b82de490d1ab99413a9c045985f826412d975b4 HEAD
