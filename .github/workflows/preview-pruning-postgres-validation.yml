name: Preview Pruning PostgreSQL Validation

on:
  push:
    branches:
      - codex/v013-preview-pruning-validation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: finspace
          POSTGRES_PASSWORD: finspace
          POSTGRES_DB: finspace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finspace -d finspace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        shell: bash

    env:
      DATABASE_URL: postgresql+asyncpg://finspace:finspace@127.0.0.1:5432/finspace
      TEST_DATABASE_URL: postgresql+asyncpg://finspace:finspace@127.0.0.1:5432/test_finspace_base
      REDIS_URL: redis://127.0.0.1:6379/0
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
      ENVIRONMENT: development
      TESTING: "true"
      JWT_SECRET_KEY: github-actions-validation-key-not-for-production-0123456789
      CORS_ORIGINS: http://localhost:3000

    steps:
      - name: Check out validation branch
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e "backend[dev]"

      - name: Mirror production Apps Script package mount
        run: |
          sudo install -d -m 0755 /app
          sudo ln -s "$GITHUB_WORKSPACE/google-apps-script" /app/google-apps-script

      - name: Runtime evidence
        run: |
          python --version
          python -m pip --version
          PGPASSWORD=finspace psql -h 127.0.0.1 -U finspace -d finspace -c "SELECT version();"
          python -c "import redis; assert redis.Redis.from_url('redis://127.0.0.1:6379/0').ping(); print('redis_ping=PASS')"

      - name: Focused pruning suite
        working-directory: backend
        run: python scripts/test_runner.py -- tests/test_categorization_preview_pruning.py -vv

      - name: Categorization regression suites
        working-directory: backend
        run: |
          python scripts/test_runner.py -- tests/test_categorization_previews.py -q
          python scripts/test_runner.py -- tests/test_categorization_bulk_apply.py -q
          python scripts/test_runner.py -- tests/test_categorization_rules.py -q
          python scripts/test_runner.py -- tests/test_automations.py -q

      - name: Alembic heads
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://finspace:finspace@127.0.0.1:5432/heads_test
        run: |
          PGPASSWORD=finspace createdb -h 127.0.0.1 -U finspace heads_test
          alembic -c alembic.ini heads
          test "$(alembic -c alembic.ini heads | head -1 | cut -d' ' -f1)" = "0016_audit_cause"

      - name: Compose topology
        run: |
          docker compose -f docker-compose.yml config --format json > /tmp/dev.json || true
          python - <<'PYEOF'
          import json, subprocess, sys
          sys.path.insert(0, "backend")
          from scripts.validate_compose_topology import validate_production
          raw = subprocess.run(
              ["docker", "compose", "-f", "docker-compose.yml", "-f", "compose.production.yml",
               "config", "--format", "json"],
              capture_output=True, text=True, check=True,
              env={"PATH": __import__("os").environ["PATH"],
                   "DATABASE_URL": "postgresql+asyncpg://finspace:finspace@127.0.0.1:5432/finspace",
                   "REDIS_URL": "redis://127.0.0.1:6379/0",
                   "JWT_SECRET_KEY": "github-actions-validation-key-not-for-production-0123456789"},
          ).stdout
          validate_production(json.loads(raw))
          print("production topology: PASS")
          PYEOF

      - name: Backend static gates
        run: |
          python -m ruff check backend
          python -m ruff format --check backend
          python -m mypy backend/app
          python -m compileall -q backend/app
          PYTHONPATH=backend python -c "from app.main import app; print('backend_import_smoke=PASS', app.title)"

      - name: Patch hygiene
        run: git diff --check

      - name: Full backend PostgreSQL suite
        working-directory: backend
        run: python scripts/test_runner.py -- -q
